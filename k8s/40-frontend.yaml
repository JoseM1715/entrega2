apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ahorro
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: josem1715/entrega2-frontend:1.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ahorro
spec:
  type: NodePort           # minikube service frontend -n ahorro --url
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
