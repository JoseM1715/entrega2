apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ahorro
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: josem1715/entrega2-backend:1.0.0
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: PG_PASSWORD } }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend            # nginx del frontend llama a http://backend:5000
  namespace: ahorro
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
