# Todo el despliegue en un comando:  kubectl apply -k k8s/
# Las etiquetas de las imagenes se cambian aqui (lo hace la CI con el SHA del commit):
#   cd k8s && kustomize edit set image josem1715/entrega2-backend=josem1715/entrega2-backend:<sha>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 10-db.yaml
  - 20-seed-job.yaml
  - 30-backend.yaml
  - 40-frontend.yaml
images:
  - name: josem1715/entrega2-backend
    newTag: 1.0.0
  - name: josem1715/entrega2-frontend
    newTag: 1.0.0
